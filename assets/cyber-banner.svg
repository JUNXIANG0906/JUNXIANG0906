<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Animated cybersecurity banner with a shield, network nodes and data packets" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#BFE1FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1D4ED8" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- Scanning band -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="260" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating security keywords -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1D4ED8" font-weight="bold">
    <text x="40" y="250" opacity="0">AES-256
      <animate attributeName="y" values="250;30" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="250" opacity="0">SHA-256
      <animate attributeName="y" values="250;30" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="270" y="250" opacity="0">0110101
      <animate attributeName="y" values="250;30" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="690" y="250" opacity="0">TLS 1.3
      <animate attributeName="y" values="250;30" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="250" opacity="0">0xFF
      <animate attributeName="y" values="250;30" dur="7s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="4s" repeatCount="indefinite"/>
    </text>
    <text x="890" y="250" opacity="0">SSH
      <animate attributeName="y" values="250;30" dur="9s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Network links (animated dashes) -->
  <g stroke="#1D4ED8" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/>
    <path d="M90 70 L200 140 L120 205"/>
    <path d="M200 140 L300 80"/>
    <path d="M200 140 L330 190"/>
    <path d="M300 80 L430 100"/>
    <path d="M330 190 L430 150"/>
    <path d="M910 70 L800 140 L880 205"/>
    <path d="M800 140 L700 80"/>
    <path d="M800 140 L670 190"/>
    <path d="M700 80 L570 100"/>
    <path d="M670 190 L570 150"/>
  </g>

  <!-- Data packets travelling to the shield -->
  <g fill="#F97316">
    <circle r="4">
      <animateMotion path="M300 80 L430 100" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion path="M330 190 L430 150" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion path="M700 80 L570 100" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4">
      <animateMotion path="M670 190 L570 150" dur="2.6s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Network nodes (pulsing) -->
  <g fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3">
    <circle cx="90" cy="70" r="9"><animate attributeName="r" values="9;12;9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="140" r="10"><animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="205" r="8"><animate attributeName="r" values="8;11;8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80" r="9"><animate attributeName="r" values="9;12;9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="190" r="9"><animate attributeName="r" values="9;12;9" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="70" r="9"><animate attributeName="r" values="9;12;9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="140" r="10"><animate attributeName="r" values="10;13;10" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="205" r="8"><animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="9"><animate attributeName="r" values="9;12;9" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="190" r="9"><animate attributeName="r" values="9;12;9" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shield pulse rings -->
  <g fill="none" stroke="#1D4ED8" stroke-width="2">
    <circle cx="500" cy="125" r="85">
      <animate attributeName="r" values="85;135" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="125" r="85">
      <animate attributeName="r" values="85;135" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shield with lock -->
  <path d="M500 42 L572 68 V127 C572 170 539 200 500 216 C461 200 428 170 428 127 V68 Z"
        fill="url(#shield)" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="478" y="118" width="44" height="36" rx="6" fill="#FFFFFF"/>
  <path d="M487 118 V108 A13 13 0 0 1 513 108 V118" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="134" r="5" fill="#1D4ED8"/>
  <rect x="498" y="134" width="4" height="12" rx="2" fill="#1D4ED8"/>

  <!-- Caption with blinking cursor -->
  <text x="500" y="248" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#0B1220" font-weight="bold">
    CYBERSECURITY // NETWORKS // ENCRYPTION<tspan fill="#1D4ED8">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
